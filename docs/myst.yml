version: 1
# Navbar, footer, logo, theme, and plugins are shared across JupyterHealth docs sites.
extends:
  - https://raw.githubusercontent.com/jupyterhealth/jupyterhealth.github.io/main/docs/_site/site.yml
project:
  title: JupyterHealth Hub
  github: https://github.com/jupyterhealth/hub
  references:
    2i2c: https://docs.2i2c.org/
    jh: https://docs.jupyterhealth.org/
    jhe: https://docs.jupyterhealth.org/software-documentation/
  toc:
    - file: index.md
    - file: sign-up.md
    - file: log-in.md
    - file: run-an-analysis.md
    - file: get-a-token.md
site:
  options:
    logo_text: Hub
    analytics_plausible: jupyter-documentation
